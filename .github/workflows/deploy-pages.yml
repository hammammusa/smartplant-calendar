name: Deploy to GitHub Pages

# Public site: https://smartplantcalendar.github.io/
# The repository is the organization site (smartplantcalendar.github.io), so the
# site is served from the domain root: NEXT_PUBLIC_BASE_PATH must stay empty.
# Deploys automatically on every push to main, and can be run by hand.
# Requires Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build static site
        run: npx next build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://smartplantcalendar.github.io
          # Optional. Public values only (Settings → Secrets and variables → Actions → Variables).
          # The publishable/anon key is safe to expose; never put a service_role key here.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Check the export is served from the domain root
        run: |
          test -f out/index.html && test -f out/404.html
          test -f out/location/index.html && test -f out/recommendations/index.html
          grep -q '"/_next/static/' out/index.html
          ! grep -q '/smartplant-calendar/' out/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
