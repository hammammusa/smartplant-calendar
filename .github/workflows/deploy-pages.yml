name: Deploy to GitHub Pages (PUBLIC — disabled)

# GitHub Pages is public: anyone with the link can open the site. The project is
# moving to private hosting (Cloudflare Pages + Access, see
# docs/PRIVATE_HOSTING.md), so this workflow no longer runs on push or on a
# schedule. It can only be started by hand, and only after typing the
# confirmation below. Delete this file once the private site is verified.

on:
  workflow_dispatch:
    inputs:
      confirm_public:
        description: 'Type PUBLISH-PUBLICLY to publish a PUBLIC copy on GitHub Pages'
        required: true
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.inputs.confirm_public == 'PUBLISH-PUBLICLY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build static site
        run: npx next build
        env:
          # e.g. "/smartplant-calendar" for https://<user>.github.io/smartplant-calendar/
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Optional. Public values only (Settings → Secrets and variables → Actions → Variables).
          # The publishable/anon key is safe to expose; never put a service_role key here.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
